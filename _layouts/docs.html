---
layout: default
---

<div class="container page with-sidebar">
    <aside class="sidebar" id="docs-sidebar">
        <button type="button" class="sidebar-toggle" aria-expanded="true" aria-controls="docs-sidebar-body">Documentation menu</button>
        <div class="sidebar-body" id="docs-sidebar-body">
            {% include docs_nav.html %}
        </div>
    </aside>

    <article class="sidebar-content">
        <h1>{{ page.title }}</h1>
        <div class="content">{{ content }}</div>
        <div class="page-footer">
            <a class="edit-link" href="{{ site.git_edit_address }}/{{ page.path }}">{% include icons.html name="edit" %} Improve this page on GitHub</a>
            {% include section_nav.html %}
        </div>
    </article>
</div>

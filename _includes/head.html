<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      // apply the theme chosen with the toggle before the page renders (no flash); without a choice the OS setting applies
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <link rel="preload" href="{{ "/assets/fonts/inter-latin-wght-normal.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ "/css/main.css" | relative_url }}">
    <link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="any">
    <link rel="apple-touch-icon" href="{{ "/img/logo-icon.png" | relative_url }}">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#151821" media="(prefers-color-scheme: dark)">
    {% seo %}
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}" />
    <script src="{{ "/js/main.js" | relative_url }}" defer></script>
</head>
